[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "loomora-agent"
version = "0.1.0"
description = "A minimal, self-built DeepSeek agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "filelock>=3.16,<4",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
loomora = "loomora.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["loomora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real DeepSeek API; opt in with RUN_LIVE_TESTS=1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
